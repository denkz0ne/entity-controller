activate:
  description: Enables and activates a Svetlo v tme controller when current rules allow it.
    Active constraints, overrides, interlocks, and blocked state are preserved.
  fields:
    controller_id:
      description: Stable controller id. If omitted, targets all controllers.
      example: 'motion_light'

clear_block:
  description: Clears the blocked state of a Svetlo v tme controller, if set
  fields:
    controller_id:
      description: Stable controller id. If omitted, targets all controllers.
      example: 'motion_light'

enable_block:
  description: Enables the blocked state of a Svetlo v tme controller, if timer is active
  fields:
    controller_id:
      description: Stable controller id. If omitted, targets all controllers.
      example: 'motion_light'

enable_stay_mode:
  description: Change the stay to on
  fields:
    controller_id:
      description: Stable controller id. If omitted, targets all controllers.
      example: 'motion_light'

disable_stay_mode:
  description: Change the stay to off
  fields:
    controller_id:
      description: Stable controller id. If omitted, targets all controllers.
      example: 'motion_light'

set_night_mode:
  description: Change the night mode start and end times, does nothing 
    if night mode is not defined in configuration. If both start_time and end_time
    are not provided, it will set both to midnight, effectivly disabling night mode.
  fields:
    controller_id:
      description: Stable controller id. If omitted, targets all controllers.
      example: 'motion_light'
    start_time:
      description: new start time to set night mode to.
      example: sunset - 00:30:00 or '18:30:00' or now or constraint (set same as day start)
    end_time:
      description: new end time to set night mode to.
      example: sunset + 03:00:00 or '21:30:00' or now or constraint (set same as day end)
