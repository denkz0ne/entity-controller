name: Entity Controller v10

on:
  push:
    branches:
      - v10-modernization
  pull_request:
    branches:
      - v10-modernization
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt pytest-asyncio homeassistant

      - name: Run v10 tests
        run: |
          python -m pytest \
            tests/test_manifest.py \
            tests/test_model.py \
            tests/test_init.py \
            tests/test_controller_fsm.py \
            tests/test_schedule.py \
            tests/test_timer_backoff.py \
            tests/test_context.py \
            -v
