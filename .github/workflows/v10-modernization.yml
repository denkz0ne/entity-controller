name: Svetlo v tme · Home Assistant tests

on:
  push:
    branches:
      - v10-modernization
  pull_request:
    branches:
      - v10-modernization
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Run Ruff
        run: |
          python -m ruff check \
            custom_components/entity_controller/__init__.py \
            custom_components/entity_controller/actions.py \
            custom_components/entity_controller/binary_sensor.py \
            custom_components/entity_controller/button.py \
            custom_components/entity_controller/config_flow.py \
            custom_components/entity_controller/const.py \
            custom_components/entity_controller/context.py \
            custom_components/entity_controller/controller.py \
            custom_components/entity_controller/diagnostics.py \
            custom_components/entity_controller/entity.py \
            custom_components/entity_controller/entry_migration.py \
            custom_components/entity_controller/legacy_entity.py \
            custom_components/entity_controller/lifecycle.py \
            custom_components/entity_controller/manager.py \
            custom_components/entity_controller/migration.py \
            custom_components/entity_controller/model.py \
            custom_components/entity_controller/panel.py \
            custom_components/entity_controller/repairs.py \
            custom_components/entity_controller/schedule.py \
            custom_components/entity_controller/sensor.py \
            custom_components/entity_controller/services.py \
            custom_components/entity_controller/storage.py \
            custom_components/entity_controller/switch.py \
            tests/test_config_flow.py \
            tests/test_config_flow_translations.py \
            tests/test_context.py \
            tests/test_controller_fsm.py \
            tests/test_diagnostics.py \
            tests/test_entry_migration.py \
            tests/test_entities.py \
            tests/test_init.py \
            tests/test_legacy_entity.py \
            tests/test_manager.py \
            tests/test_lifecycle.py \
            tests/test_light_profile_restore.py \
            tests/test_manifest.py \
            tests/test_migration.py \
            tests/test_model.py \
            tests/test_repository_branding.py \
            tests/test_persistence.py \
            tests/test_panel.py \
            tests/test_release_gate.py \
            tests/test_reconcile.py \
            tests/test_reconfigure.py \
            tests/test_repairs.py \
            tests/test_repository_metadata.py \
            tests/test_schedule.py \
            tests/test_services.py \
            tests/test_timer_backoff.py

      - name: Validate repository metadata
        run: |
          python -m pytest tests/test_repository_metadata.py -v

      - name: Run integration tests
        run: |
          python -m pytest \
            tests/test_manifest.py \
            tests/test_repository_metadata.py \
            tests/test_repository_branding.py \
            tests/test_model.py \
            tests/test_init.py \
            tests/test_controller_fsm.py \
            tests/test_schedule.py \
            tests/test_timer_backoff.py \
            tests/test_context.py \
            tests/test_manager.py \
            tests/test_lifecycle.py \
            tests/test_light_profile_restore.py \
            tests/test_reconcile.py \
            tests/test_reconfigure.py \
            tests/test_entities.py \
            tests/test_entry_migration.py \
            tests/test_services.py \
            tests/test_config_flow.py \
            tests/test_config_flow_translations.py \
            tests/test_migration.py \
            tests/test_legacy_entity.py \
            tests/test_persistence.py \
            tests/test_panel.py \
            tests/test_release_gate.py \
            tests/test_diagnostics.py \
            tests/test_repairs.py \
            -v

  panel-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements_test.txt playwright
          python -m playwright install --with-deps chromium
      - name: Check panel browser test style
        run: python -m ruff check tests/test_panel_browser.py
      - name: Test desktop wheel and mobile touch scrolling
        run: python -m pytest tests/test_panel_browser.py -v
